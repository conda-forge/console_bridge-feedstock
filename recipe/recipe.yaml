schema_version: 1

context:
  version: "1.0.2"

package:
  name: console_bridge
  version: ${{ version }}

source:
  url: https://github.com/ros/console_bridge/archive/${{ version }}.tar.gz
  sha256: 303a619c01a9e14a3c82eb9762b8a428ef5311a6d46353872ab9a904358be4a4
  patches:
    - 96.patch

build:
  number: 2

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
  run_exports:
    - ${{ pin_subpackage('console_bridge', upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - if: unix
          then: console_bridge
      files:
        - if: win
          then:
            - Library/CMake/console_bridge-targets.cmake
            - Library/CMake/console_bridge-config.cmake
  - requirements:
      run:
        - pkg-config
    script:
      - pkg-config --modversion console_bridge
      - pkg-config --exists --print-errors --debug console_bridge
      - pkg-config --validate --print-errors --debug console_bridge

about:
  homepage: http://github.com/ros/console_bridge
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A ROS-independent package for logging that seamlessly pipes into rosconsole/rosout for ROS-dependent packages.
  repository: https://github.com/ros/console_bridge

extra:
  recipe-maintainers:
    - jcarpent
    - wolfv
